name: Scheduled Cloudflare Pages Deploy

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        run: curl --fail --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
